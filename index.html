<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f6ed">
    <title>Daily · 项目目录</title>
    <link rel="icon" href="./meridian-atlas/assets/compass.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <header class="masthead">
        <div class="wordmark"><img src="./meridian-atlas/assets/compass.svg" width="34" height="34" alt="">Daily</div>
        <span>项目目录</span>
    </header>
    <main>
        <section class="cover" aria-labelledby="atlas-title">
            <div class="introduction">
                <p class="subtitle">世界地图集</p>
                <h1 id="atlas-title" lang="en">Meridian <em>Atlas</em></h1>
                <p class="description">在平面地图与立体地球之间切换，<br>探索国家、城市与地标，聆听地名发音。</p>
                <a class="open-atlas" href="./meridian-atlas/index.html">进入地图集 <span aria-hidden="true">→</span></a>
            </div>
            <figure class="plate">
                <img class="globe" src="./atlas-cover.webp" width="1280" height="960" alt="以非洲和欧洲为中心的地球，金色曲线标出赤道">
                <figcaption><span>正射投影</span><span>20° N &nbsp;/&nbsp; 15° E</span></figcaption>
            </figure>
        </section>
        <nav class="shortcuts" aria-labelledby="shortcut-title">
            <h2 id="shortcut-title">快速入口</h2>
            <a href="./meridian-atlas/index.html#index">
                <span><strong>地点索引</strong><small>查国旗、首都与发音</small></span>
                <span class="link-arrow" aria-hidden="true">→</span>
            </a>
            <a href="./meridian-atlas/index.html#guide">
                <span><strong>学习指南</strong><small>读轮廓、辨国旗、练习地图定位</small></span>
                <span class="link-arrow" aria-hidden="true">→</span>
            </a>
        </nav>
    </main>
</body>
</html>
